name: Trigger Dokploy Redeploy

on:
  push:
    branches: [ main ]

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy webhook (diagnóstico)
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Triggering Dokploy redeploy..."
          # remove possible CR/LF or surrounding whitespace from secret
          url="$(echo -n "$DOKPLOY_WEBHOOK_URL" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [[ -z "$url" ]]; then
            echo "DOKPLOY_WEBHOOK_URL is empty or invalid" >&2
            exit 1
          fi
          echo "Webhook URL: $url"
          response=$(curl -sS -L -D - -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36' -H 'Accept: application/json' -X POST "$url" --write-out "\n%{http_code}")
          http_code=$(printf '%s' "$response" | tail -n1)
          body=$(printf '%s' "$response" | sed '$d')
          echo "HTTP status: $http_code"
          echo "Response body (first 500 chars):"
          printf '%s' "$body" | head -c 500
          printf '\n'
          if [[ "$http_code" -ne 200 ]]; then
            echo "Deploy webhook returned HTTP $http_code" >&2
            exit 1
          fi
          if printf '%s' "$body" | grep -qi '<html'; then
            echo "Deploy webhook returned HTML; likely Cloudflare challenge or invalid endpoint." >&2
            exit 1
          fi
          echo "Dokploy webhook triggered successfully."
